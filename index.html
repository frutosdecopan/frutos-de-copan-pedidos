<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Frutos de Copán | Pedidos</title>
  <!--
    La fuente se carga sin bloquear el primer pintado de la página: en una
    red móvil lenta/inestable, un <link rel="stylesheet"> normal a un
    dominio externo (fonts.googleapis.com) puede tardar mucho en responder,
    y hasta que responde el navegador no pinta NADA (pantalla en blanco),
    sin importar qué tan rápido esté cargando el resto de la app. Con este
    patrón (preload + swap de "media") la página se pinta de inmediato con
    una fuente de respaldo del sistema, y la tipografía Inter se aplica en
    cuanto termine de llegar, sin bloquear nada mientras tanto.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .no-scrollbar {
      -ms-overflow-style: none;
      /* IE and Edge */
      scrollbar-width: none;
      /* Firefox */
    }

    /* Placeholder mostrado antes de que React arranque (visible en cuanto el
       HTML se parsea, sin depender de ningún JS ni CSS externo) — React lo
       reemplaza automáticamente al montar dentro de #root. En una red lenta,
       esto evita una pantalla en blanco mientras se descarga el bundle. */
    #initial-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 100vh;
      color: #6b7280;
      font-size: 14px;
    }

    #initial-loading .spinner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 4px solid #fed7aa;
      border-bottom-color: #ea580c;
      animation: initial-loading-spin 0.8s linear infinite;
    }

    @keyframes initial-loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-50 transition-colors duration-200">
  <div id="root">
    <div id="initial-loading">
      <div class="spinner"></div>
      <p>Cargando Frutos de Copán...</p>
    </div>
  </div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
